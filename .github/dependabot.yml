version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /mailer
      - /upload-cleaner
      - /db/migrator
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /
      - /mailer/docker
      - /upload-cleaner/docker
      - /db/docker
      - /db/migrator
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
