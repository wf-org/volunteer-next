name: Build images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            repository: ${{ vars.ECR_REPOSITORY_APP }}
            context: .
            dockerfile: Dockerfile
          - name: mailer
            repository: ${{ vars.ECR_REPOSITORY_MAILER }}
            context: mailer
            dockerfile: mailer/docker/Dockerfile
          - name: upload-cleaner
            repository: ${{ vars.ECR_REPOSITORY_UPLOAD_CLEANER }}
            context: upload-cleaner
            dockerfile: upload-cleaner/docker/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # Lambda rejects image indexes; disable attestations so a single manifest is pushed.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
