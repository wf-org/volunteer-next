name: Build and deploy

on:
  push:
    branches: [main,lambda-updates]
    # paths:
    #   - 'src/**'
    #   - 'upload-cleaner/**'
    #   - 'mailer/**'
    #   - 'db/**'
    #   - 'package.json'
    #   - 'deploy/**'
    #   - '.github/workflows/build-images.yml'
    #   - '**/Dockerfile'
  workflow_dispatch:

# Deploys run one at a time and are never cancelled mid-migration.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    # The Lambda functions run on arm64
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: app
            repository: ${{ vars.ECR_REPOSITORY_APP }}
            context: .
            dockerfile: Dockerfile
            target: runner
          - name: mailer
            repository: ${{ vars.ECR_REPOSITORY_MAILER }}
            context: mailer
            dockerfile: mailer/docker/Dockerfile
            target: lambda
          - name: upload-cleaner
            repository: ${{ vars.ECR_REPOSITORY_UPLOAD_CLEANER }}
            context: upload-cleaner
            dockerfile: upload-cleaner/docker/Dockerfile
            target: lambda
          - name: migrations
            repository: ${{ vars.ECR_REPOSITORY_MIGRATIONS }}
            context: db
            dockerfile: db/migrator/Dockerfile
            target: lambda
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          # Lambda rejects image indexes; disable attestations so a single manifest is pushed.
          provenance: false
          sbom: false
          tags: |
            ${{ matrix.repository }}:${{ github.sha }}
            ${{ matrix.repository }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install sops
        env:
          SOPS_VERSION: 3.13.3
          # From sops-v3.13.3.checksums.txt on the release page
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          curl -fsSLo "$RUNNER_TEMP/sops" \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "$SOPS_SHA256  $RUNNER_TEMP/sops" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/sops" /usr/local/bin/sops

      # aws-lambda-deploy (v1.1.2) calls UpdateFunctionConfiguration on every run
      # and sends the `environment` input as the function's whole environment, so
      # migrate, mailer and upload-cleaner get their current variables passed back.
      - name: Resolve images and environments
        id: resolve
        env:
          TAG: ${{ github.sha }}
          FUNCTIONS: |
            migrate ${{ vars.LAMBDA_FUNCTION_MIGRATE }} ${{ vars.ECR_REPOSITORY_MIGRATIONS }}
            mailer ${{ vars.LAMBDA_FUNCTION_MAILER }} ${{ vars.ECR_REPOSITORY_MAILER }}
            upload_cleaner ${{ vars.LAMBDA_FUNCTION_UPLOAD_CLEANER }} ${{ vars.ECR_REPOSITORY_UPLOAD_CLEANER }}
            web ${{ vars.LAMBDA_FUNCTION_WEB }} ${{ vars.ECR_REPOSITORY_APP }}
        run: |
          set -euo pipefail
          echo "$FUNCTIONS" | while read -r id function repository; do
            [ -n "$id" ] || continue
            # Deploy by digest, so the function doesn't follow a moving tag
            digest=$(aws ecr batch-get-image \
              --repository-name "${repository#*/}" \
              --image-ids imageTag="$TAG" \
              --query 'images[0].imageId.imageDigest' --output text)
            echo "$function -> $repository@$digest"
            echo "${id}_image=$repository@$digest" >> "$GITHUB_OUTPUT"

            # The web function's environment is built in its own step
            if [ "$id" = web ]; then continue; fi
            environment=$(aws lambda get-function-configuration --function-name "$function" \
              --query 'Environment.Variables' --output json | jq -c '. // {}')
            # Action inputs are printed in the log; mask the values
            jq -r '.[]' <<< "$environment" | while IFS= read -r value; do
              if [ -n "$value" ]; then echo "::add-mask::$value"; fi
            done
            echo "${id}_environment=$environment" >> "$GITHUB_OUTPUT"
          done

      # The migrate function holds POSTGRES_URL (Neon direct, not pooled, URI)
      # in its own environment, which the step above passes back unchanged.
      - name: Update migrate function
        uses: aws-actions/aws-lambda-deploy@v1.1.2
        with:
          function-name: ${{ vars.LAMBDA_FUNCTION_MIGRATE }}
          package-type: Image
          image-uri: ${{ steps.resolve.outputs.migrate_image }}
          environment: ${{ steps.resolve.outputs.migrate_environment }}

      - name: Run migrations
        env:
          FUNCTION: ${{ vars.LAMBDA_FUNCTION_MIGRATE }}
        run: |
          # The action doesn't wait for the code update
          aws lambda wait function-updated --function-name "$FUNCTION"
          # Synchronous; --cli-read-timeout 0 so a long migration isn't dropped at 60s
          aws lambda invoke \
            --function-name "$FUNCTION" \
            --cli-read-timeout 0 \
            --log-type Tail \
            result.json > invoke.json
          jq -r '.LogResult' invoke.json | base64 -d
          cat result.json; echo
          if jq -e '.FunctionError' invoke.json > /dev/null; then exit 1; fi

      # Environment = deploy/prod/env + deploy/prod/env.secrets.enc (SOPS, KMS
      # alias/sops). It replaces the web function's whole environment.
      - name: Web function environment
        id: web-env
        run: |
          set -euo pipefail
          umask 077
          secrets="$RUNNER_TEMP/secrets.env"
          plain_json="$RUNNER_TEMP/plain.json"
          secrets_json="$RUNNER_TEMP/secrets.json"
          trap 'rm -f "$secrets" "$plain_json" "$secrets_json"' EXIT
          sops -d deploy/prod/env.secrets.enc > "$secrets"

          # Writes a KEY=value file to $2 as a JSON object; empty values are skipped.
          # With $3 = secret, values are masked and lines are never echoed.
          env_to_json() {
            local file=$1 out=$2 kind=${3:-plain} json='{}' line key value
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}"
              line="${line#"${line%%[![:space:]]*}"}"
              case "$line" in '' | '#'*) continue ;; esac
              line="${line#export }"
              key="${line%%=*}"
              value="${line#*=}"
              if ! [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ && "$line" == *=* ]]; then
                if [ "$kind" = secret ]; then
                  echo "::error::$file has a line that isn't KEY=value"
                else
                  echo "::error::$file has a line that isn't KEY=value: $line"
                fi
                exit 1
              fi
              if [[ "$value" =~ ^\"(.*)\"$ || "$value" =~ ^\'(.*)\'$ ]]; then value="${BASH_REMATCH[1]}"; fi
              if [ -z "$value" ]; then
                echo "::notice::$key is empty in $file; skipped"
                continue
              fi
              if [ "$kind" = secret ]; then echo "::add-mask::$value"; fi
              json=$(jq -c --arg k "$key" --arg v "$value" '. + {($k): $v}' <<< "$json")
            done < "$file"
            printf '%s\n' "$json" > "$out"
          }

          env_to_json "$secrets" "$secrets_json" secret
          [ "$(jq length "$secrets_json")" -gt 0 ] ||
            { echo "::error::No secrets found in env.secrets.enc"; exit 1; }
          env_to_json deploy/prod/env "$plain_json"

          jq -r --slurpfile secrets "$secrets_json" \
            'keys[] | select(. as $k | $secrets[0] | has($k))' "$plain_json" |
            while IFS= read -r key; do
              echo "::warning::$key is in both deploy/prod/env and env.secrets.enc; using the secret"
            done

          environment=$(jq -cs '.[0] + .[1]' "$plain_json" "$secrets_json")
          echo "Setting: $(jq -r 'keys | join(" ")' <<< "$environment")"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"

      - name: Update mailer function
        uses: aws-actions/aws-lambda-deploy@v1.1.2
        with:
          function-name: ${{ vars.LAMBDA_FUNCTION_MAILER }}
          package-type: Image
          image-uri: ${{ steps.resolve.outputs.mailer_image }}
          environment: ${{ steps.resolve.outputs.mailer_environment }}

      - name: Update upload-cleaner function
        uses: aws-actions/aws-lambda-deploy@v1.1.2
        with:
          function-name: ${{ vars.LAMBDA_FUNCTION_UPLOAD_CLEANER }}
          package-type: Image
          image-uri: ${{ steps.resolve.outputs.upload_cleaner_image }}
          environment: ${{ steps.resolve.outputs.upload_cleaner_environment }}

      - name: Update web function
        uses: aws-actions/aws-lambda-deploy@v1.1.2
        with:
          function-name: ${{ vars.LAMBDA_FUNCTION_WEB }}
          package-type: Image
          image-uri: ${{ steps.resolve.outputs.web_image }}
          environment: ${{ steps.web-env.outputs.environment }}

      # The action doesn't wait for code updates; wait so a failed update fails the job
      - name: Wait for functions
        env:
          FUNCTIONS: |
            ${{ vars.LAMBDA_FUNCTION_MAILER }}
            ${{ vars.LAMBDA_FUNCTION_UPLOAD_CLEANER }}
            ${{ vars.LAMBDA_FUNCTION_WEB }}
        run: |
          echo "$FUNCTIONS" | while read -r function; do
            [ -n "$function" ] || continue
            aws lambda wait function-updated --function-name "$function"
          done
